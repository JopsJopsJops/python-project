name: Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: [3.9, 3.10, 3.11, 3.12]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xkb1 libxkbcommon-x11-0 xvfb
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run tests with pytest
      run: |
        python -m pytest tests/ -v --cov=expense_tracker_app --cov-report=xml --cov-report=html
        
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.os }}-${{ matrix.python-version }}
        path: htmlcov/
        retention-days: 30

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install type stubs
      run: |
        pip install types-reportlab types-openpyxl types-PyYAML
        # Note: PyQt5, matplotlib, xlsxwriter, fpdf don't have official type stubs
        
    - name: Check code formatting with black
      run: |
        black --check expense_tracker_app/ tests/
        
    - name: Check imports sorting with isort
      run: |
        isort --check-only expense_tracker_app/ tests/
        
    - name: Lint with flake8
      run: |
        flake8 expense_tracker_app/ tests/ --count --show-source --statistics --max-line-length=100
        
    - name: Type checking with mypy (lenient)
      run: |
        mypy expense_tracker_app/ --ignore-missing-imports --disallow-untyped-defs=false

    - name: Type checking with mypy
      run: |
        mypy expense_tracker_app/    