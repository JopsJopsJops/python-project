name: "Python CI"

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: [3.9, 3.10, 3.11, 3.12]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysims1 libxcb-randr0 libxcb-render-util0 libxcb-xkb1 libxkbcommon-x11-0 xvfb
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        # Windows usually has Qt dependencies included, but you can add specific ones if needed
        echo "Windows dependencies handled by installed Python packages"
        
    - name: Run tests with pytest
      run: |
        python -m pytest tests/ -v --cov=expense_tracker_app --cov-report=xml --cov-report=html
        
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.os }}-${{ matrix.python-version }}
        path: htmlcov/
        retention-days: 30

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install linting tools only
      run: |
        python -m pip install --upgrade pip
        pip install black==23.12.1 flake8==6.1.0 isort==5.13.2 mypy==1.8.0 types-reportlab types-openpyxl types-PyYAML
        
    - name: Auto-format with black and isort
      run: |
        # Format imports first
        isort expense_tracker_app/ tests/
        
        # Then format code
        black expense_tracker_app/ tests/
        
        # Check if any formatting changes were made
        if git diff --exit-code; then
          echo "✅ Code is already properly formatted"
        else
          echo "🔄 Code was auto-formatted, committing changes..."
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "style: Auto-format with black and isort"
          git push
          echo "✅ Formatting complete and changes pushed"
        fi
        
    - name: Lint with flake8
      run: |
        flake8 expense_tracker_app/ tests/ --count --show-source --statistics --max-line-length=100
        
    - name: Type checking with mypy
      run: |
        mypy expense_tracker_app/