[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings  
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

ignore = [
    "E501",  # line too long - handled by formatter
    "F841",  # unused variable - too many false positives in PyQt
    "F401",  # unused import - test files have many
    "B007",  # unused loop variable - common in tests
    "T201",  # print found - common in scripts
]

line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841", "B007", "S101", "T201"]
"scripts/*" = ["F401", "F841", "B007", "T201"]
"fix_*.py" = ["ALL"]
"revert_*.py" = ["ALL"]

[tool.ruff.format]
quote-style = "double"