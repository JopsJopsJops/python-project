[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

[tool:pytest]
addopts = 
    --verbose
    --color=yes
    --strict-markers
    --strict-config
    --cov=expense_tracker_app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    -n auto
    
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    qt: marks tests as requiring Qt
    integration: integration tests
    
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnhandledThreadExceptionWarning